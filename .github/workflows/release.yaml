name: Release

on:
  push:
    branches:
      # the default branch
      - master

permissions:
  contents: write

jobs:
  # This mirrors build_and_test workflow
  build_and_test:
    name: 'Build and Test'
    uses: StackStorm-Exchange/ci/.github/workflows/pack-build_and_test.yaml@850dc21ae7ace9619f1ff3d2e927b13b9512ee36
    with:
      enable-common-libs: true
      #apt-cache-version: v0
      #py-cache-version: v0
      python-version: '["3.10", "3.11"]'

  tag_release:
    needs: build_and_test
    name: Tag Release
    uses: StackStorm-Exchange/ci/.github/workflows/pack-tag_release.yaml@850dc21ae7ace9619f1ff3d2e927b13b9512ee36
    with:
      python-version: '["3.10", "3.11"]'
